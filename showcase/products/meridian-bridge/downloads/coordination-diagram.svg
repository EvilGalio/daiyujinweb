<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" aria-labelledby="title desc"><title id="title">A commercial brief with separate local review owners</title><desc id="desc">Singapore coordination connects commercial questions to separately appointed local specialists for Malaysia, Indonesia and Vietnam. Conceptual workflow, not a geographic or legal map.</desc><rect width="680" height="440" fill="#e8e1d7"/><g stroke="#97777d" stroke-width="1.5" fill="none"><path d="M200 220H280V100H375M280 220H375M280 220V340H375"/></g><rect x="28" y="157" width="185" height="126" fill="#5c2432"/><g font-family="Arial,sans-serif" fill="#fff8ef"><text x="46" y="190" font-size="12">SINGAPORE</text><text x="46" y="218" font-size="17">Commercial brief</text><text x="46" y="245" font-size="11">Decision and review owners</text></g><g fill="#faf7f1" stroke="#b9ada1"><rect x="375" y="55" width="278" height="90"/><rect x="375" y="175" width="278" height="90"/><rect x="375" y="295" width="278" height="90"/></g><g font-family="Arial,sans-serif" fill="#332c2a"><text x="396" y="88" font-size="15">Malaysia</text><text x="396" y="115" font-size="11">Independent local review owner</text><text x="396" y="208" font-size="15">Indonesia</text><text x="396" y="235" font-size="11">Independent local review owner</text><text x="396" y="328" font-size="15">Vietnam</text><text x="396" y="355" font-size="11">Independent local review owner</text><text x="28" y="423" font-size="10">Illustrative coordination only. Not a geographic map, legal opinion or claim of jurisdictional coverage.</text></g></svg>
