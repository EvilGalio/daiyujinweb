<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 540" role="img" aria-labelledby="title desc"><title id="title">A commercial brief with separate local review owners</title><desc id="desc">Singapore coordination connects a commercial brief to separately appointed local review owners in Malaysia, Indonesia and Vietnam. Conceptual workflow, not a map or legal opinion.</desc><rect width="320" height="540" fill="#e8e1d7"/><path d="M160 128V466" fill="none" stroke="#97777d" stroke-width="2"/><rect x="20" y="24" width="280" height="104" fill="#5c2432"/><g font-family="Arial,sans-serif" fill="#fff8ef"><text x="40" y="52" font-size="12">SINGAPORE</text><text x="40" y="81" font-size="21">Commercial brief</text><text x="40" y="108" font-size="13">Decision and review owners</text></g><g fill="#faf7f1" stroke="#b9ada1"><rect x="20" y="160" width="280" height="84"/><rect x="20" y="276" width="280" height="84"/><rect x="20" y="392" width="280" height="84"/></g><g font-family="Arial,sans-serif" fill="#332c2a"><text x="40" y="192" font-size="20">Malaysia</text><text x="40" y="220" font-size="13">Independent local review owner</text><text x="40" y="308" font-size="20">Indonesia</text><text x="40" y="336" font-size="13">Independent local review owner</text><text x="40" y="424" font-size="20">Vietnam</text><text x="40" y="452" font-size="13">Independent local review owner</text><text x="20" y="506" font-size="11">Illustrative coordination only.</text><text x="20" y="524" font-size="11">Not a map or a promise of coverage.</text></g></svg>
