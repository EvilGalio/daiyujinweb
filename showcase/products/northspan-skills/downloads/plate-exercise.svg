<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">Northspan plate drawing exercise</title><desc id="desc">A 100 by 60 millimetre plate with two 10 millimetre holes centred at 20,30 and 80,30. A teaching exercise, not a manufacturing drawing.</desc><rect width="640" height="440" fill="#fffdf7"/><g font-family="Arial,sans-serif" fill="#172d3b"><text x="38" y="43" font-size="16" font-weight="700">NORTHSPAN / THE FIRST DRAWING</text><text x="38" y="67" font-size="11">2D classroom exercise. Dimensions in mm.</text></g><g fill="none" stroke="#274c61" stroke-width="2"><rect x="120" y="120" width="400" height="240"/><circle cx="200" cy="240" r="20"/><circle cx="440" cy="240" r="20"/><path d="M120 100V85M520 100V85M120 92H520M530 120H552M530 360H552M545 120V360M180 240H220M200 220V260M420 240H460M440 220V260" stroke-width="1"/><path d="M120 92l9 -4M120 92l9 4M520 92l-9 -4M520 92l-9 4M545 120l-4 9M545 120l4 9M545 360l-4 -9M545 360l4 -9" stroke-width="1.5"/></g><g font-family="Arial,sans-serif" fill="#172d3b" font-size="13"><text x="310" y="84">100</text><text x="553" y="245">60</text><text x="173" y="280">Ø10</text><text x="413" y="280">Ø10</text><text x="146" y="389">Hole centres: (20, 30) and (80, 30), from bottom left.</text><text x="38" y="420" font-size="11">Teaching sample only. Material, thickness and tolerances are not specified.</text></g></svg>
